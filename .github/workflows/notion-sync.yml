name: Sync Notion projects and documents

# Runs daily at 01:00 UTC = 08:00 Vietnam (ICT).
# Also runnable on-demand from the Actions tab.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug — verify token shape and connectivity (safe, no value leaked)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, json
          t = os.environ.get('NOTION_TOKEN', '')
          if not t:
              print('❌ NOTION_TOKEN is EMPTY in env')
              exit(1)
          print(f'✅ Token length: {len(t)}')
          print(f'   Prefix (first 4): {t[:4]!r}')
          print(f'   Suffix (last 4): {t[-4:]!r}')
          print(f'   Has trailing whitespace: {t != t.strip()}')
          # Probe Notion with /users/me (lightweight)
          req = urllib.request.Request(
              'https://api.notion.com/v1/users/me',
              headers={
                  'Authorization': f'Bearer {t.strip()}',
                  'Notion-Version': '2022-06-28',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  body = json.loads(r.read())
                  print(f'✅ Notion /users/me OK — bot: {body.get("name")} (type={body.get("type")})')
                  ws = body.get('bot', {}).get('workspace_name')
                  print(f'   Workspace name: {ws}')
          except urllib.error.HTTPError as e:
              print(f'❌ Notion /users/me failed: {e.code} {e.reason}')
              print(e.read().decode())
              exit(1)
          PY

      - name: Fetch Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/fetch-notion.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notion-projects.json notion-documents.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: auto-refresh Notion snapshots ($(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d))"
            git push
          fi
