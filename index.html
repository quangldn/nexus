<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nexus — Quang's Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0f1115; --panel: #161922; --panel-2: #1c2030;
    --border: #262b3a; --text: #e6e8ee; --muted: #8a92a6;
    --accent: #6aa9ff; --accent-2: #9b7bff; --warn: #ffb454; --ok: #5cd6a4;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fb; --panel: #ffffff; --panel-2: #f0f2f8;
      --border: #e3e6ef; --text: #1a1d24; --muted: #5f6776;
      --accent: #2563eb; --accent-2: #7c3aed;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, var(--bg) 80%, transparent);
    padding: 18px 28px 12px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h1 .dot { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 12px; margin-left: 4px; }
  #search {
    flex: 1; min-width: 240px; max-width: 480px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 14px; outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
  main {
    padding: 20px 28px 60px;
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px 12px;
    display: flex; flex-direction: column; min-height: 80px;
  }
  .card.notion { grid-column: span 2; }
  @media (max-width: 760px) { .card.notion { grid-column: span 1; } }
  .card h2 {
    margin: 0 0 10px; font-size: 13px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 .icon { font-size: 16px; }
  .card h2 .count {
    margin-left: auto; font-size: 11px; color: var(--muted);
    background: var(--panel-2); padding: 2px 7px; border-radius: 10px;
    border: 1px solid var(--border);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .link, .copybtn {
    display: block; width: 100%; text-align: left;
    padding: 7px 9px; margin: 1px -9px;
    border-radius: 7px; color: var(--text);
    text-decoration: none; line-height: 1.35;
    border: 1px solid transparent;
    background: transparent; cursor: pointer; font: inherit;
  }
  .link:hover, .copybtn:hover { background: var(--panel-2); border-color: var(--border); }
  .link .title, .copybtn .title { font-weight: 500; }
  .link .note, .copybtn .note { font-size: 11.5px; color: var(--muted); margin-top: 1px; word-break: break-all; }
  .link.hot, .copybtn.hot { border-left: 2px solid var(--warn); padding-left: 11px; }
  .copybtn .title::before { content: "📋  "; opacity: .6; }
  .empty { color: var(--muted); font-size: 12px; padding: 6px 0; }
  .pill { font-size: 10.5px; padding: 1px 6px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
  .pill.status-won { color: var(--ok); border-color: rgba(92,214,164,.4); }
  .pill.status-active { color: var(--accent); border-color: rgba(106,169,255,.4); }
  .pill.status-lost { color: #ff7a7a; border-color: rgba(255,122,122,.4); }
  .pill.status-pending { color: var(--warn); border-color: rgba(255,180,84,.4); }
  .proj-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 9px; margin: 1px -9px;
    border-radius: 7px; border: 1px solid transparent;
  }
  .proj-row:hover { background: var(--panel-2); border-color: var(--border); }
  .proj-row .name { flex: 1; font-weight: 500; }
  .proj-row .updated { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .proj-row .links a { color: var(--accent); text-decoration: none; font-size: 11.5px; margin-left: 6px; }
  .proj-row .links a:hover { text-decoration: underline; }
  footer {
    padding: 0 28px 28px; color: var(--muted); font-size: 11.5px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  kbd { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 11px; }
  .hidden { display: none !important; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 16px; border-radius: 10px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .error-banner {
    margin: 18px 28px; padding: 12px 16px;
    background: rgba(255,122,122,.08); border: 1px solid rgba(255,122,122,.3);
    border-radius: 8px; color: #ff9a9a; font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>Nexus<span class="dot">.</span></h1>
  <span class="subtitle">your quick-access desk</span>
  <input id="search" type="search" placeholder="Filter links & projects…  (Ctrl+K)" autocomplete="off" />
  <span class="meta" id="meta"></span>
</header>

<div id="errors"></div>
<main id="grid"></main>

<footer>
  <span>Edits: <kbd>data.json</kbd> for links, <kbd>notion-projects.json</kbd> for Notion snapshot. Push to GitHub, refresh this page.</span>
  <span id="last-edited"></span>
</footer>

<div id="toast"></div>

<script>
(async function () {
  const grid = document.getElementById('grid');
  const meta = document.getElementById('meta');
  const lastEd = document.getElementById('last-edited');
  const errors = document.getElementById('errors');
  const toast = document.getElementById('toast');

  function showError(msg) {
    const div = document.createElement('div');
    div.className = 'error-banner';
    div.textContent = msg;
    errors.appendChild(div);
  }

  async function loadJson(path) {
    try {
      const res = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      showError('Could not load ' + path + ' — ' + (e.message || e));
      return null;
    }
  }

  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function escapeAttr(s) { return escapeHtml(s); }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  async function copyToClipboard(text) {
    try {
      if (navigator.clipboard) await navigator.clipboard.writeText(text);
      else {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      showToast('Path copied — paste in File Explorer');
    } catch (e) {
      showToast('Copy failed: ' + (e.message || e));
    }
  }

  // Load data files in parallel
  const [data, notion] = await Promise.all([
    loadJson('data.json'),
    loadJson('notion-projects.json')
  ]);

  if (!data) {
    showError('Cannot continue without data.json.');
    return;
  }

  // Render link cards
  let totalLinks = 0;
  for (const cat of data.categories || []) {
    const card = document.createElement('section');
    card.className = 'card';
    card.dataset.category = cat.name;
    const items = (cat.links || []).map((l, i) => {
      const note = l.note ? '<div class="note">' + escapeHtml(l.note) + '</div>' : '';
      const cls = l.hot ? 'hot' : '';
      const search = ((l.title || '') + ' ' + (l.note || '') + ' ' + (l.url || l.path || '')).toLowerCase();
      if (l.local) {
        return `<li><button class="copybtn ${cls}" data-path="${escapeAttr(l.path)}" data-search="${escapeAttr(search)}">
                  <span class="title">${escapeHtml(l.title)}</span>
                  <div class="note">${escapeHtml(l.path)}</div>
                  ${l.note ? '<div class="note">' + escapeHtml(l.note) + '</div>' : ''}
                </button></li>`;
      }
      return `<li><a class="link ${cls}" href="${escapeAttr(l.url)}" target="_blank" rel="noopener" data-search="${escapeAttr(search)}">
                <span class="title">${escapeHtml(l.title)}</span>${note}
              </a></li>`;
    }).join('');
    card.innerHTML =
      `<h2><span class="icon">${escapeHtml(cat.icon || '•')}</span>${escapeHtml(cat.name)}<span class="count">${(cat.links || []).length}</span></h2>` +
      `<ul>${items || '<li class="empty">No links yet.</li>'}</ul>`;
    grid.appendChild(card);
    totalLinks += (cat.links || []).length;
  }

  // Render Notion card
  const notionCard = document.createElement('section');
  notionCard.className = 'card notion';
  notionCard.dataset.category = 'Notion projects';
  let notionInner = '<h2><span class="icon">📋</span>Notion projects';
  let projCount = 0;
  if (notion && Array.isArray(notion.projects) && notion.projects.length > 0) {
    projCount = notion.projects.length;
    notionInner += `<span class="count">${projCount}</span></h2><ul>`;
    for (const p of notion.projects) {
      const status = (p.status || '').toLowerCase();
      const statusCls = 'pill status-' + (status.includes('won') ? 'won' :
                                          status.includes('lost') ? 'lost' :
                                          status.includes('pend') || status.includes('wait') ? 'pending' :
                                          status ? 'active' : '');
      const search = ((p.name || '') + ' ' + (p.status || '') + ' ' + (p.customer || '')).toLowerCase();
      const linksHtml = (p.links || []).map(lnk =>
        `<a href="${escapeAttr(lnk.url)}" target="_blank" rel="noopener">${escapeHtml(lnk.label || 'open')}</a>`).join('');
      notionInner += `<li><div class="proj-row" data-search="${escapeAttr(search)}">
        <span class="name">${escapeHtml(p.name)}</span>
        ${p.status ? `<span class="${statusCls}">${escapeHtml(p.status)}</span>` : ''}
        <span class="links">${linksHtml}</span>
        ${p.updated ? `<span class="updated">${escapeHtml(p.updated)}</span>` : ''}
      </div></li>`;
    }
    notionInner += '</ul>';
    if (notion.lastSync) notionInner += `<div class="empty" style="margin-top:8px">Last sync: ${escapeHtml(notion.lastSync)}</div>`;
  } else {
    notionInner += '</h2><div class="empty">No Notion projects yet. Ask Claude on your personal laptop: "refresh Notion" — it will pull your DB and push an updated <kbd>notion-projects.json</kbd> to the repo.</div>';
  }
  notionCard.innerHTML = notionInner;
  grid.appendChild(notionCard);

  meta.textContent = totalLinks + ' links · ' + (data.categories || []).length + ' categories' + (projCount ? ' · ' + projCount + ' projects' : '');
  if (data.lastEdited) lastEd.textContent = 'Links updated: ' + data.lastEdited + (notion && notion.lastSync ? ' · Notion: ' + notion.lastSync : '');

  // Click handler for local-file copy buttons (event delegation)
  document.addEventListener('click', e => {
    const btn = e.target.closest('.copybtn');
    if (!btn) return;
    e.preventDefault();
    copyToClipboard(btn.dataset.path);
  });

  // Live search across links AND projects
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
      let anyVisible = false;
      card.querySelectorAll('[data-search]').forEach(el => {
        const hit = !q || el.dataset.search.includes(q);
        const li = el.closest('li');
        if (li) li.classList.toggle('hidden', !hit);
        else el.classList.toggle('hidden', !hit);
        if (hit) anyVisible = true;
      });
      card.classList.toggle('hidden', !anyVisible && q.length > 0);
    });
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); search.focus(); search.select();
    }
    if (e.key === 'Escape' && document.activeElement === search) {
      search.value = ''; search.dispatchEvent(new Event('input')); search.blur();
    }
  });
})();
</script>
</body>
</html>
