    wrap.appendChild(hero);

    const docs = (documents && Array.isArray(documents.documents)) ? documents.documents : [];
    const hasPortfolio = (d, code) => (d.portfolio || []).some(p => p === code);
    const hasTag = (d, tg) => (d.tags || []).some(x => x === tg);

    const curated = (t.curatedPages || {});
    const VIEWS = [
      { id: 'home', label: '🏠 Home' },
      { id: 'pins', label: '📌 My Pins' },
      { id: 'roadmap', label: '🗺️ Roadmap', filter: d => hasTag(d, 'Roadmap') },
      { id: 'gx', label: '📡 1830 GX', curatedKey: 'gx' },
      { id: 'pss', label: '📡 1830 PSS', curatedKey: 'pss' },
      { id: 'others', label: '📂 Others', filter: d => !hasPortfolio(d, 'GX') && !hasPortfolio(d, 'PSS') },
    ];

    // === My Pins state helpers (localStorage-only, Nokia laptop scratch-pad) ===
    // State shape v2:
    //   { pages: [{ id, name, blocks: [{ id, name, links: [...] }] }], activePage: 'pg_..' }
    // Legacy shape v1 (auto-migrated): { blocks: [...] }
    const PINS_KEY = 'nexus.pins';
    const pinsUid = pfx => pfx + Math.random().toString(36).slice(2, 9);
    function makeDefaultPage(name) {
      return { id: pinsUid('pg_'), name: name || 'Homepage', blocks: [
        { id: pinsUid('b_'), name: 'Quick links', links: [] }
      ]};
    }
    function normalizePins(state) {
      if (!state || !Array.isArray(state.pages) || state.pages.length === 0) {
        const pg = makeDefaultPage('Homepage');
        return { pages: [pg], activePage: pg.id };
      }
      // Ensure ids, names, blocks arrays
      state.pages.forEach(pg => {
        if (!pg.id) pg.id = pinsUid('pg_');
        if (!pg.name) pg.name = 'Untitled';
        if (!Array.isArray(pg.blocks)) pg.blocks = [];
      });
      if (!state.activePage || !state.pages.find(p => p.id === state.activePage)) {
        state.activePage = state.pages[0].id;
      }
      return state;
    }
    function loadPins() {
      try {
        const raw = localStorage.getItem(PINS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.pages)) return normalizePins(parsed);
          // Legacy v1 → migrate
          if (parsed && Array.isArray(parsed.blocks)) {
            const pg = { id: pinsUid('pg_'), name: 'Homepage', blocks: parsed.blocks };
            return { pages: [pg], activePage: pg.id };
          }
        }
      } catch (e) {}
      const pg = makeDefaultPage('Homepage');
      return { pages: [pg], activePage: pg.id };
    }
    function savePins(state) {
      try { localStorage.setItem(PINS_KEY, JSON.stringify(state)); } catch (e) {}
    }
    function pinsTotal() {
      try {
        const raw = localStorage.getItem(PINS_KEY);
        if (!raw) return 0;
        const p = JSON.parse(raw);
        if (Array.isArray(p.pages)) {
          return p.pages.reduce((s, pg) =>
            s + (pg.blocks || []).reduce((s2, b) => s2 + (b.links || []).length, 0), 0);
        }
        return (p.blocks || []).reduce((s, b) => s + (b.links || []).length, 0);
      } catch (e) { return 0; }
    }
    // Detect whether a string is a web URL or a local Windows path.
    // Supports: http(s)://, file:///C:/..., C:\..., \\server\share, with optional surrounding quotes.
    function detectLinkKind(raw) {
      let s = (raw || '').trim();
      // strip surrounding quotes (Windows "Copy as path" wraps in ")
      s = s.replace(/^["']+|["']+$/g, '').trim();
      if (!s) return null;
      if (/^https?:\/\//i.test(s)) return { kind: 'web', value: s };
      if (/^file:\/\//i.test(s)) {
        let p = decodeURIComponent(s.replace(/^file:\/+/i, ''));
        if (/^[a-z]:/i.test(p)) p = p.replace(/\//g, '\\');
        return { kind: 'local', value: p };
      }
      // Windows drive path  C:\... or C:/...
      if (/^[a-z]:[\\\/]/i.test(s)) return { kind: 'local', value: s.replace(/\//g, '\\') };
      // UNC path  \\server\share
      if (/^\\\\/.test(s)) return { kind: 'local', value: s };
      // Looks like a domain → assume web
      if (/^[\w.-]+\.[a-z]{2,}([\/?#]|$)/i.test(s)) return { kind: 'web', value: 'https://' + s };
      return { kind: 'web', value: s };
    }
    function localIcon(p) {
      const lower = (p || '').toLowerCase();
      if (/\.docx?$/.test(lower)) return '📘';
      if (/\.(xlsx?|csv)$/.test(lower)) return '📗';
      if (/\.pptx?$/.test(lower)) return '📙';
      if (/\.pdf$/.test(lower)) return '📕';
      if (/\.(bat|cmd|exe|ps1|sh)$/.test(lower)) return '⚙️';
      if (/\.(txt|md|log|ini|cfg)$/.test(lower)) return '📝';
      if (/\.(zip|7z|rar|tar|gz)$/.test(lower)) return '🗜️';
      if (/\.(png|jpe?g|gif|bmp|webp|svg)$/.test(lower)) return '🖼️';
      if (/\.(mp4|mov|avi|mkv)$/.test(lower)) return '🎬';
      if (/\.(mp3|wav|flac|m4a)$/.test(lower)) return '🎵';
      // Folder = no extension, or trailing slash/backslash
      if (!/\.[a-z0-9]{1,5}$/i.test(p) || /[\\\/]$/.test(p)) return '📁';
      return '📄';
    }
    function defaultLocalTitle(p) {
      const clean = (p || '').replace(/[\\\/]+$/, '');
      const seg = clean.split(/[\\\/]/).filter(Boolean).pop();
      return seg || clean;
    }

    // Dropdown selector
    const switcher = document.createElement('div');
    switcher.className = 'view-switcher';
    const sel = document.createElement('select');
    sel.id = 'wiki-view';
    function countCuratedLinks(key) {
      const pg = curated[key];
      if (!pg) return 0;
      return (pg.blocks || []).reduce((s, b) => s + (b.links || []).length, 0);
    }
    VIEWS.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      let count = '';
      if (v.id === 'home') count = ` (${docs.filter(d => d.important).length} ⭐)`;
      else if (v.id === 'pins') count = ` (${pinsTotal()})`;
      else if (v.curatedKey) count = ` (${countCuratedLinks(v.curatedKey)})`;
      else if (v.filter) count = ` (${docs.filter(v.filter).length})`;
      opt.textContent = v.label + count;
      sel.appendChild(opt);
    });
    switcher.innerHTML = '<label for="wiki-view">View:</label>';
    switcher.appendChild(sel);
    wrap.appendChild(switcher);

    const content = document.createElement('div');
    content.className = 'doc-content';
    wrap.appendChild(content);

    function renderHome() {
      content.innerHTML = '';

      const title = document.createElement('h1');
      title.className = 'wiki-title';
      title.textContent = 'Product Wiki Home Page';
      content.appendChild(title);

      // LEFT col: ROADMAP — fixed callout + 4 Important Roadmap docs
      // RIGHT col: Frequent use — fixed callout + Important docs NOT tagged Roadmap
      const roadmapDocs = docs.filter(d => d.important && hasTag(d, 'Roadmap'));
      const freqDocs = docs.filter(d => d.important && !hasTag(d, 'Roadmap'));

      const homeGrid = document.createElement('div');
      homeGrid.className = 'wiki-home';

      // === LEFT: ROADMAP ===
      const leftCol = document.createElement('div');
      leftCol.className = 'wiki-col';
      let leftHtml = '<h2>ROADMAP</h2>';
      leftHtml += `
        <div class="wiki-featured" style="cursor:default">
          <span class="bulb">💡</span>
          <span class="ft-title">Latest Roadmap Update - Q2-26</span>
        </div>
      `;
      leftHtml += '<div class="wiki-list">';
      if (roadmapDocs.length === 0) {
        leftHtml += '<div class="wiki-list-item empty-note">Mark roadmap docs as Important in Notion to pin them here.</div>';
      } else {
        roadmapDocs.forEach(d => {
          leftHtml += `<a class="wiki-list-item" href="${escapeAttr(d.url)}" target="_blank" rel="noopener" data-search="${escapeAttr(d.name.toLowerCase())}">${escapeHtml(d.name)}</a>`;
        });
      }
      leftHtml += '</div>';
      leftCol.innerHTML = leftHtml;
      homeGrid.appendChild(leftCol);

      // === RIGHT: Frequent use ===
      const rightCol = document.createElement('div');
      rightCol.className = 'wiki-col';
      let rightHtml = '<h2>Frequent use</h2>';
      rightHtml += `
        <div class="wiki-featured" style="cursor:default">
          <span class="bulb">💡</span>
          <span class="ft-title">Important files</span>
        </div>
      `;
      rightHtml += '<div class="wiki-list">';
      if (freqDocs.length === 0) {
        rightHtml += '<div class="wiki-list-item empty-note">Mark non-roadmap docs as Important in Notion to fill this list.</div>';
      } else {
        freqDocs.forEach(d => {
          rightHtml += `<a class="wiki-list-item" href="${escapeAttr(d.url)}" target="_blank" rel="noopener" data-search="${escapeAttr(d.name.toLowerCase())}">${escapeHtml(d.name)}</a>`;
        });
      }
      rightHtml += '</div>';
      rightCol.innerHTML = rightHtml;
      homeGrid.appendChild(rightCol);

      content.appendChild(homeGrid);
    }

    function renderCurated(viewId) {
      content.innerHTML = '';
      const def = VIEWS.find(s => s.id === viewId);
      const pg = def && curated[def.curatedKey];
      if (!pg) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No curated content yet for this product line.';
        content.appendChild(empty);
        return;
      }
      const title = document.createElement('h1');
      title.className = 'wiki-title';
      title.textContent = (pg.icon ? pg.icon + ' ' : '') + pg.name;
      content.appendChild(title);
      content.appendChild(renderBlocks({ blocks: pg.blocks || [], layout: 'auto' }));
    }

    function renderFiltered(viewId) {
      content.innerHTML = '';
      const def = VIEWS.find(s => s.id === viewId);
      if (!def || !def.filter) { renderHome(); return; }
      const filtered = docs.filter(def.filter);
      filtered.sort((a, b) => {
        if ((b.important?1:0) !== (a.important?1:0)) return (b.important?1:0) - (a.important?1:0);
        return (a.name || '').localeCompare(b.name || '');
      });
      const section = document.createElement('div');
      section.className = 'doc-section';
      section.innerHTML = `<h3>${escapeHtml(def.label)} <span class="grp-count">${filtered.length}</span></h3>`;
      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No documents match this filter yet.';
        section.appendChild(empty);
      } else {
        section.appendChild(renderDocTable(filtered));
      }
      content.appendChild(section);
    }

    function activateView(id) {
      sel.value = id;
      const def = VIEWS.find(s => s.id === id);
      if (id === 'home') renderHome();
      else if (id === 'pins') renderPins();
      else if (def && def.curatedKey) renderCurated(id);
      else renderFiltered(id);
      try { localStorage.setItem('nexus.productsView', id); } catch (e) {}
      // Refresh pins count in dropdown label
      const pinsOpt = [...sel.options].find(o => o.value === 'pins');
      if (pinsOpt) pinsOpt.textContent = '📌 My Pins (' + pinsTotal() + ')';
    }

    // ===== My Pins view: multi-page drag-drop scratchpad. localStorage only. =====
    function renderPins() {
      content.innerHTML = '';
      let state = loadPins();
      const currentPage = () => state.pages.find(p => p.id === state.activePage) || state.pages[0];

      // Top: page tab bar
      const pageBar = document.createElement('div');
      pageBar.className = 'pages-bar';
      content.appendChild(pageBar);

      const toolbar = document.createElement('div');
      toolbar.className = 'pins-toolbar';
      toolbar.innerHTML = `
        <button class="pins-btn" id="pins-addlink" type="button" title="Add a web link or a local file/folder path">+ Add link</button>
        <button class="pins-btn ghost" id="pins-add" type="button">+ Add block</button>
        <button class="pins-btn ghost" id="pins-export" type="button" title="Download backup JSON (all pages)">⬇ Export</button>
        <button class="pins-btn ghost" id="pins-import" type="button" title="Restore from a backup JSON">⬆ Import</button>
        <span class="pins-hint">Drag a tab from Edge onto a block, or use + Add link for local files.</span>
      `;
      content.appendChild(toolbar);

      const addForm = document.createElement('div');
      addForm.className = 'pin-add-form';
      addForm.innerHTML = `
        <input type="text" id="pins-addlink-input" placeholder="Paste URL or path… e.g. https://… or C:\\Users\\… or \\\\server\\share" autocomplete="off" />
        <input type="text" id="pins-addlink-title" placeholder="Title (optional)" style="flex: 0 1 200px; min-width: 140px;" />
        <select id="pins-addlink-block"></select>
        <button class="pins-btn" id="pins-addlink-go" type="button">Add</button>
        <button class="pins-btn ghost" id="pins-addlink-cancel" type="button">Cancel</button>
        <div class="form-hint">
          Web: <code>https://...</code> · Local file: <code>C:\\path\\file.xlsx</code> (right-click in Explorer → <em>Copy as path</em>) · Folder: <code>C:\\path\\</code> · Network: <code>\\\\server\\share</code>. Local entries copy the path to clipboard on click (Edge blocks <code>file://</code> from HTTPS).
        </div>
      `;
      content.appendChild(addForm);

      const grid = document.createElement('div');
      grid.className = 'pins-grid';
      content.appendChild(grid);

      function refreshDropdownCount() {
        const opt = [...sel.options].find(o => o.value === 'pins');
        if (opt) opt.textContent = '📌 My Pins (' + pinsTotal() + ')';
      }

      function paintPageBar() {
        pageBar.innerHTML = '';
        state.pages.forEach(pg => {
          const tab = document.createElement('div');
          tab.className = 'page-tab' + (pg.id === state.activePage ? ' active' : '');
          const cnt = (pg.blocks || []).reduce((s, b) => s + (b.links || []).length, 0);
          tab.innerHTML = `${escapeHtml(pg.name)}<span class="pg-count">${cnt}</span>`;
          tab.title = 'Click to switch · Double-click to rename';
          tab.addEventListener('click', () => {
            if (state.activePage === pg.id) return;
            state.activePage = pg.id;
            savePins(state);
            paintPageBar();
            paint();
          });
          tab.addEventListener('dblclick', () => {
            const n = prompt('Rename page:', pg.name);
            if (n !== null) {
              pg.name = n.trim() || 'Untitled';
              savePins(state);
              paintPageBar();
            }
          });
          pageBar.appendChild(tab);
        });

        const addPageBtn = document.createElement('button');
        addPageBtn.className = 'page-add';
        addPageBtn.type = 'button';
        addPageBtn.textContent = '+ New page';
        addPageBtn.addEventListener('click', () => {
          const n = prompt('Page name:', 'New page');
          if (n === null) return;
          const newPg = { id: pinsUid('pg_'), name: n.trim() || 'Untitled', blocks: [] };
          state.pages.push(newPg);
          state.activePage = newPg.id;
          savePins(state);
          paintPageBar();
          paint();
        });
        pageBar.appendChild(addPageBtn);

        const actions = document.createElement('div');
        actions.className = 'page-actions';
        const renameBtn = document.createElement('button');
        renameBtn.className = 'page-action-btn';
        renameBtn.type = 'button';
        renameBtn.textContent = '✏ Rename';
        renameBtn.title = 'Rename current page';
        renameBtn.addEventListener('click', () => {
          const cur = currentPage();
          if (!cur) return;
          const n = prompt('Rename page:', cur.name);
          if (n !== null) {
            cur.name = n.trim() || 'Untitled';
            savePins(state);
            paintPageBar();
          }
        });
        actions.appendChild(renameBtn);

        const delPageBtn = document.createElement('button');
        delPageBtn.className = 'page-action-btn danger';
        delPageBtn.type = 'button';
        delPageBtn.textContent = '🗑 Delete page';
        delPageBtn.title = 'Delete current page';
        delPageBtn.addEventListener('click', () => {
          const cur = currentPage();
          if (!cur) return;
          if (state.pages.length === 1) {
            showToast('Cannot delete the last page — add another first');
            return;
          }
          const links = (cur.blocks || []).reduce((s, b) => s + (b.links || []).length, 0);
          const blocks = (cur.blocks || []).length;
          if (!confirm(`Delete page "${cur.name}" (${blocks} block${blocks !== 1 ? 's' : ''}, ${links} pinned link${links !== 1 ? 's' : ''})?`)) return;
          state.pages = state.pages.filter(p => p.id !== cur.id);
          state.activePage = state.pages[0].id;
          savePins(state);
          refreshDropdownCount();
          paintPageBar();
          paint();
        });
        actions.appendChild(delPageBtn);
        pageBar.appendChild(actions);
      }

      function paint() {
        grid.innerHTML = '';
        const cur = currentPage();
        if (!cur) return;
        cur.blocks = cur.blocks || [];
        cur.blocks.forEach(block => {
          const bEl = document.createElement('div');
          bEl.className = 'pin-block';
          bEl.dataset.blockId = block.id;

          const head = document.createElement('div');
          head.className = 'pin-block-head';
          const nameInput = document.createElement('input');
          nameInput.className = 'pin-block-name';
          nameInput.type = 'text';
          nameInput.value = block.name || '';
          nameInput.placeholder = 'Block name';
          nameInput.addEventListener('change', () => {
            block.name = nameInput.value.trim() || 'Untitled';
            savePins(state);
          });
          // prevent dragstart on input
          nameInput.addEventListener('dragstart', e => e.stopPropagation());
          head.appendChild(nameInput);

          const delBtn = document.createElement('span');
          delBtn.className = 'pin-block-del';
          delBtn.textContent = '🗑';
          delBtn.title = 'Delete block';
          delBtn.addEventListener('click', () => {
            const n = (block.links || []).length;
            const msg = n > 0
              ? `Delete block "${block.name}" and its ${n} pinned link${n > 1 ? 's' : ''}?`
              : `Delete block "${block.name}"?`;
            if (confirm(msg)) {
              cur.blocks = cur.blocks.filter(b => b.id !== block.id);
              savePins(state);
              refreshDropdownCount();
              paintPageBar();
              paint();
            }
          });
          head.appendChild(delBtn);
          bEl.appendChild(head);

          const list = document.createElement('div');
          list.className = 'pin-list';
          if (!block.links || block.links.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'pin-empty';
            empty.textContent = 'Drop link here';
            list.appendChild(empty);
          } else {
            block.links.forEach(link => {
              const a = document.createElement(link.local ? 'button' : 'a');
              a.className = 'pin-item' + (link.local ? ' local' : '');
              if (link.local) {
                a.type = 'button';
              } else {
                a.href = link.url;
                a.target = '_blank';
                a.rel = 'noopener';
              }
              a.draggable = true;
              a.dataset.linkId = link.id;
              a.dataset.search = ((link.title || '') + ' ' + (link.url || '') + ' ' + (link.host || '')).toLowerCase();
              const kindIcon = link.local ? localIcon(link.url) : (link.icon || '🔗');
              const hostLabel = link.local ? 'click to copy path' : (link.host || '');
              a.innerHTML = `
                <span class="pin-kind">${escapeHtml(kindIcon)}</span>
                <span class="pin-title" title="${escapeAttr(link.url)}">${escapeHtml(link.title || link.url)}</span>
                <span class="pin-host">${escapeHtml(hostLabel)}</span>
                <span class="pin-x" title="Remove">✕</span>
              `;
              if (link.local) {
                // Click on item (but not X) → copy path to clipboard. Edge blocks file:// links from HTTPS pages.
                a.addEventListener('click', e => {
                  if (e.target.closest('.pin-x')) return;
                  e.preventDefault();
                  copyToClipboard(link.url);
                });
              }
              // Rename on right-click / shift-click
              a.addEventListener('contextmenu', e => {
                e.preventDefault();
                const nt = prompt('Rename link:', link.title || '');
                if (nt !== null) {
                  link.title = nt.trim() || link.url;
                  savePins(state);
                  paint();
                }
              });
              a.querySelector('.pin-x').addEventListener('click', e => {
                e.preventDefault();
                e.stopPropagation();
                block.links = block.links.filter(l => l.id !== link.id);
                savePins(state);
                refreshDropdownCount();
                paintPageBar();
                paint();
              });
              a.addEventListener('dragstart', e => {
                e.dataTransfer.setData('application/x-nexus-pin', JSON.stringify({ blockId: block.id, linkId: link.id }));
                e.dataTransfer.effectAllowed = 'move';
                a.classList.add('dragging');
              });
              a.addEventListener('dragend', () => a.classList.remove('dragging'));
              list.appendChild(a);
            });
          }
          bEl.appendChild(list);

          // Drag-over visual + drop handler on the whole block
          bEl.addEventListener('dragover', e => {
            e.preventDefault();
            bEl.classList.add('drag-over');
            const isInternal = e.dataTransfer.types.includes('application/x-nexus-pin');
            e.dataTransfer.dropEffect = isInternal ? 'move' : 'copy';
          });
          bEl.addEventListener('dragleave', e => {
            if (e.target === bEl || !bEl.contains(e.relatedTarget)) {
              bEl.classList.remove('drag-over');
            }
          });
          bEl.addEventListener('drop', e => {
            e.preventDefault();
            bEl.classList.remove('drag-over');

            // 1) Internal move between blocks (within current page only)
            const internal = e.dataTransfer.getData('application/x-nexus-pin');
            if (internal) {
              try {
                const { blockId, linkId } = JSON.parse(internal);
                if (blockId === block.id) return;
                const src = cur.blocks.find(b => b.id === blockId);
                if (!src) return;
                const idx = (src.links || []).findIndex(l => l.id === linkId);
                if (idx < 0) return;
                const [moved] = src.links.splice(idx, 1);
                block.links = block.links || [];
                block.links.push(moved);
                savePins(state);
                paint();
              } catch (err) {}
              return;
            }

            // 2) External URL drop (from Edge tab, bookmark, or address bar)
            const uri = e.dataTransfer.getData('text/uri-list') || '';
            const plain = e.dataTransfer.getData('text/plain') || '';
            const html = e.dataTransfer.getData('text/html') || '';
            const raw = uri || plain;
            const urls = raw.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith('#'));
            if (urls.length === 0) {
              showToast('No URL detected in drop');
              return;
            }

            // Try to read a title from text/html (Edge sends "<a href=...>title</a>")
            let titleFromHtml = '';
            if (html) {
              const m = html.match(/<a[^>]*>([\s\S]*?)<\/a>/i);
              if (m) {
                const tmp = document.createElement('div');
                tmp.innerHTML = m[1];
                titleFromHtml = (tmp.textContent || '').trim();
              }
            }

            let added = 0;
            urls.forEach(u => {
              const det = detectLinkKind(u);
              if (!det) return;
              let host = '';
              let defaultTitle = det.value;
              if (det.kind === 'web') {
                try {
                  const parsed = new URL(det.value);
                  host = parsed.hostname.replace(/^www\./, '');
                  const lastSeg = parsed.pathname.split('/').filter(Boolean).pop();
                  defaultTitle = lastSeg ? decodeURIComponent(lastSeg).replace(/[-_+]/g, ' ') : host;
                } catch (err) { return; }
              } else {
                defaultTitle = defaultLocalTitle(det.value);
              }
              block.links = block.links || [];
              block.links.push({
                id: pinsUid('p_'),
                title: titleFromHtml || defaultTitle,
                url: det.value,
                host: host,
                local: det.kind === 'local',
                added: new Date().toISOString()
              });
              added++;
            });
            if (added > 0) {
              savePins(state);
              refreshDropdownCount();
              paintPageBar();
              paint();
              showToast('Pinned ' + added + ' link' + (added > 1 ? 's' : '') + ' to "' + (block.name || 'block') + '"');
            } else {
              showToast('Could not parse a URL from the drop');
            }
          });

          grid.appendChild(bEl);
        });
      }
      paintPageBar();
      paint();

      toolbar.querySelector('#pins-add').addEventListener('click', () => {
        const cur = currentPage();
        cur.blocks = cur.blocks || [];
        cur.blocks.push({ id: pinsUid('b_'), name: 'New block', links: [] });
        savePins(state);
        paintPageBar();
        paint();
      });

      // === Add link form ===
      const addLinkBtn = toolbar.querySelector('#pins-addlink');
      const addInput = addForm.querySelector('#pins-addlink-input');
      const addTitle = addForm.querySelector('#pins-addlink-title');
      const addBlockSel = addForm.querySelector('#pins-addlink-block');
      function refreshBlockSelect() {
        const cur = currentPage();
        addBlockSel.innerHTML = '';
        (cur.blocks || []).forEach(b => {
          const opt = document.createElement('option');
          opt.value = b.id;
          opt.textContent = '→ ' + (b.name || 'Untitled');
          addBlockSel.appendChild(opt);
        });
        if (!cur.blocks || cur.blocks.length === 0) {
          const opt = document.createElement('option');
          opt.value = '__new__';
          opt.textContent = '→ (creates "Quick links")';
          addBlockSel.appendChild(opt);
        }
      }
      function openAddForm() {
        refreshBlockSelect();
        addForm.classList.add('open');
        addInput.value = '';
        addTitle.value = '';
        setTimeout(() => addInput.focus(), 0);
      }
      function closeAddForm() {
        addForm.classList.remove('open');
      }
      function submitAddLink() {
        const raw = addInput.value;
        const det = detectLinkKind(raw);
        if (!det) { showToast('Paste a URL or path first'); addInput.focus(); return; }
        const cur = currentPage();
        cur.blocks = cur.blocks || [];
        let targetBlock;
        if (addBlockSel.value === '__new__' || cur.blocks.length === 0) {
          targetBlock = { id: pinsUid('b_'), name: 'Quick links', links: [] };
          cur.blocks.push(targetBlock);
        } else {
          targetBlock = cur.blocks.find(b => b.id === addBlockSel.value) || cur.blocks[0];
        }
        let title = (addTitle.value || '').trim();
        let host = '';
        if (det.kind === 'web') {
          try { host = new URL(det.value).hostname.replace(/^www\./, ''); } catch (e) {}
          if (!title) {
            try {
              const u = new URL(det.value);
              const lastSeg = u.pathname.split('/').filter(Boolean).pop();
              title = lastSeg ? decodeURIComponent(lastSeg).replace(/[-_+]/g, ' ') : host;
            } catch (e) { title = det.value; }
          }
        } else {
          if (!title) title = defaultLocalTitle(det.value);
        }
        targetBlock.links = targetBlock.links || [];
        targetBlock.links.push({
          id: pinsUid('p_'),
          title: title || det.value,
          url: det.value,
          host: host,
          local: det.kind === 'local',
          added: new Date().toISOString()
        });
        savePins(state);
        refreshDropdownCount();
        paintPageBar();
        paint();
        showToast((det.kind === 'local' ? 'Pinned local: ' : 'Pinned: ') + (title || det.value));
        closeAddForm();
      }
      addLinkBtn.addEventListener('click', () => {
        if (addForm.classList.contains('open')) closeAddForm(); else openAddForm();
      });
      addForm.querySelector('#pins-addlink-go').addEventListener('click', submitAddLink);
      addForm.querySelector('#pins-addlink-cancel').addEventListener('click', closeAddForm);
      addInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); submitAddLink(); }
        else if (e.key === 'Escape') { e.preventDefault(); closeAddForm(); }
      });
      addTitle.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); submitAddLink(); }
        else if (e.key === 'Escape') { e.preventDefault(); closeAddForm(); }
      });
      toolbar.querySelector('#pins-export').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'nexus-pins-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      });
      toolbar.querySelector('#pins-import').addEventListener('click', () => {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'application/json,.json';
        inp.addEventListener('change', () => {
          const file = inp.files && inp.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              let next;
              if (parsed && Array.isArray(parsed.pages)) {
                next = normalizePins(parsed);
              } else if (parsed && Array.isArray(parsed.blocks)) {
                // Legacy single-page shape
                const pg = { id: pinsUid('pg_'), name: 'Imported', blocks: parsed.blocks };
                next = { pages: [pg], activePage: pg.id };
              } else {
                throw new Error('Bad format');
              }
              if (!confirm('Replace current pins with imported data?')) return;
              state = next;
              savePins(state);
              refreshDropdownCount();
              paintPageBar();
              paint();
              showToast('Imported');
            } catch (e) {
              showToast('Import failed: ' + (e.message || e));
            }
          };
          reader.readAsText(file);
        });
        inp.click();
      });
    }

    sel.addEventListener('change', () => activateView(sel.value));

    let initial = 'home';
    try {
      const sub = localStorage.getItem('nexus.productsView');
      if (sub && VIEWS.find(s => s.id === sub)) initial = sub;
    } catch (e) {}
    activateView(initial);

    if (documents.lastSync) {
      const sync = document.createElement('div');
      sync.style.cssText = 'margin-top:14px;font-size:11.5px;color:var(--muted)';
      sync.textContent = 'Last Notion sync: ' + documents.lastSync + (documents.source ? ' · ' + documents.source : '');
      wrap.appendChild(sync);
    }

    appendSyncFooter(wrap, t);
    return wrap;
  }

  // ---- Search across visible panel ----
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    const activePanel = document.querySelector('.panel.active');
    if (!activePanel) return;
    activePanel.querySelectorAll('[data-search]').forEach(el => {
      const hit = !q || el.dataset.search.includes(q);
      el.classList.toggle('hidden', !hit);
    });
  });

  // ---- Prevent the browser from navigating when a URL is dropped outside a pin block ----
  window.addEventListener('dragover', e => {
    if (e.dataTransfer && e.dataTransfer.types && (e.dataTransfer.types.includes('text/uri-list') || e.dataTransfer.types.includes('text/plain'))) {
      e.preventDefault();
    }
  });
  window.addEventListener('drop', e => {
    if (!e.target.closest('.pin-block')) {
      // Only block default if it looks like a URL drop (avoid breaking native form/file drops)
      if (e.dataTransfer && e.dataTransfer.types && (e.dataTransfer.types.includes('text/uri-list') || e.dataTransfer.types.includes('text/plain'))) {
        e.preventDefault();
      }
    }
  });

  // ---- Local path copy ----
  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-path]');
    if (btn && btn.dataset.path) {
      e.preventDefault();
      e.stopPropagation();
      copyToClipboard(btn.dataset.path);
    }
  }, true);

  // ---- Shortcuts ----
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); search.focus(); search.select();
    }
    if (e.key === 'Escape' && document.activeElement === search) {
      search.value = ''; search.dispatchEvent(new Event('input')); search.blur();
    }
    if (document.activeElement !== search && /^[1-9]$/.test(e.key)) {
      const idx = parseInt(e.key, 10) - 1;
      const btn = document.querySelectorAll('.tab')[idx];
      if (btn) activateTab(btn.dataset.tab);
    }
  });

  // ---- Meta ----
  const totalLinks = tabs.reduce((sum, t) => {
    if (t.links) return sum + t.links.length;
    if (t.groups) return sum + t.groups.reduce((s, g) => s + (g.links || []).length, 0);
    if (t.blocks) return sum + t.blocks.reduce((s, b) => s + (b.links || []).length, 0);
    return sum;
  }, 0);
  metaEl.textContent = totalLinks + ' links · ' + tabs.length + ' tabs';
  if (data.lastEdited) lastEd.textContent = 'Links updated: ' + data.lastEdited + (notion && notion.lastSync ? ' · Notion: ' + notion.lastSync : '');
})();
</script>
</body>
</html>
