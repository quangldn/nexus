<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nokia · Nexus</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23124191'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Segoe UI, sans-serif' font-size='28' font-weight='800' fill='white'%3EN%3C/text%3E%3C/svg%3E" />
<style>
  /* ===== Nokia Pure web fonts (official brand kit, woff2 only) ===== */
  @font-face {
    font-family: 'Nokia Pure Headline';
    src: url('fonts/NokiaPureHeadline_Bd.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Nokia Pure Headline';
    src: url('fonts/NokiaPureHeadline_Rg.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Nokia Pure Text';
    src: url('fonts/NokiaPureText_Rg.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Nokia Pure Text';
    src: url('fonts/NokiaPureText_Md.woff2') format('woff2');
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Nokia Pure Text';
    src: url('fonts/NokiaPureText_Bd.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }

  :root {
    /* Official Nokia 2026 palette (from brand kit theme1.xml) */
    --brand-blue: #005AFF;    /* Nokia Bright Blue — primary accent, links, active states */
    --navy: #005AFF;          /* alias for brand blue (used in existing rules) */
    --navy-dark: #001135;     /* Nokia Dark Navy — headings, primary text */
    --navy-deep: #000820;     /* very deep navy for hover/dark accents */
    --navy-soft: #e6edff;     /* light brand blue tint for chips/hover bg */
    --navy-tint: #f4f7ff;     /* even softer tint */
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-2: #f7f8fa;
    --border: #ebebeb;        /* Nokia Light Grey */
    --border-strong: #d4d6db;
    --text: #001135;          /* Nokia Dark Navy as body text */
    --muted: #666666;         /* Nokia Grey */
    --warn: #f47f31;          /* Nokia Orange */
    --ok: #37cc73;            /* Nokia Green */
    --danger: #e03dcd;        /* Nokia Pink */
    --teal: #23abb6;
    --purple: #7d33f2;
    --shadow: 0 1px 2px rgba(0,17,53,.04), 0 4px 12px rgba(0,17,53,.05);
    --shadow-md: 0 2px 4px rgba(0,17,53,.06), 0 8px 24px rgba(0,17,53,.08);
    --font-text: 'Nokia Pure Text', -apple-system, 'Segoe UI', system-ui, sans-serif;
    --font-headline: 'Nokia Pure Headline', 'Nokia Pure Text', -apple-system, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 var(--font-text);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: var(--font-headline); letter-spacing: -0.01em; }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .header-row {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 32px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo-svg { height: 28px; width: auto; display: block; }
  .brand-divider { width: 1px; height: 24px; background: var(--border-strong); }
  .app-name {
    font-family: var(--font-headline);
    font-size: 19px; font-weight: 700; color: var(--navy-dark);
    letter-spacing: -0.01em;
  }
  .app-tag {
    font-size: 10.5px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500;
    border: 1px solid var(--border); padding: 3px 8px; border-radius: 10px;
    margin-left: 2px;
  }
  #search {
    flex: 1; min-width: 220px; max-width: 360px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13.5px; outline: none;
    transition: border-color .15s, background .15s;
  }
  #search:focus { border-color: var(--navy); background: #fff; }
  .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
  nav.tabs {
    display: flex; gap: 2px;
    padding: 0 32px; border-bottom: 1px solid var(--border);
    background: #fff;
  }
  .tab {
    background: transparent; border: none;
    padding: 13px 18px 14px; margin-bottom: -1px;
    cursor: pointer; font: inherit; font-weight: 600; font-size: 13.5px;
    color: var(--muted); border-bottom: 2px solid transparent;
    display: flex; align-items: center; gap: 8px;
    transition: color .15s, border-color .15s, background .15s;
    letter-spacing: 0.01em;
  }
  .tab:hover { color: var(--navy-dark); background: var(--navy-tint); }
  .tab.active {
    color: var(--navy-dark); border-bottom-color: var(--navy-dark);
    background: transparent;
  }
  .tab .tab-icon { font-size: 15px; }
  main { padding: 28px 32px 60px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .box-grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }

  /* ===== Homepage "blocks" layout (2-col card grid) + curated subpages ===== */
  .blocks-2col {
    display: grid; grid-template-columns: 1fr 1fr; gap: 22px;
    align-items: start;
  }
  .blocks-col { display: flex; flex-direction: column; gap: 22px; }
  @media (max-width: 820px) {
    .blocks-2col { grid-template-columns: 1fr; }
  }
  .curated-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 22px;
    align-items: start;
  }
  .home-block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 18px 14px;
    box-shadow: var(--shadow);
    transition: box-shadow .15s, border-color .15s;
  }
  .home-block:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
  .home-block-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .home-block-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--navy-soft); color: var(--navy-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .home-block-name {
    font-size: 15.5px; font-weight: 700;
    color: var(--navy-dark);
    letter-spacing: -0.005em;
  }
  .home-link-list { display: flex; flex-direction: column; gap: 1px; }
  .home-link {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 10px; border-radius: 8px;
    text-decoration: none; color: var(--text);
    transition: background .12s, transform .08s;
    border: none; background: transparent; cursor: pointer;
    font: inherit; text-align: left; width: 100%;
  }
  .home-link:hover { background: var(--navy-tint); }
  .home-link:active { transform: translateX(2px); }
  .home-link-icon {
    width: 30px; height: 30px;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    flex-shrink: 0;
  }
  .home-link-text {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 1px;
  }
  .home-link-title {
    font-weight: 600; font-size: 13.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text);
  }
  .home-link-sub {
    font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .home-link-arrow {
    color: var(--muted); font-size: 13px; flex-shrink: 0;
    transition: transform .12s, color .12s;
  }
  .home-link:hover .home-link-arrow {
    color: var(--navy); transform: translateX(2px);
  }
  .home-link.local .home-link-arrow::after { content: "📋"; margin-left: 4px; font-size: 11px; opacity: .75; }

  /* ===== Insights (Knowledge Base) ===== */
  .insights-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .insight-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow);
    transition: box-shadow .15s, border-color .15s, transform .12s;
    min-height: 160px;
  }
  .insight-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--navy);
    transform: translateY(-2px);
  }
  .insight-card.important { border-left: 3px solid var(--navy-dark); }
  .insight-card-title {
    font-size: 15.5px; font-weight: 700;
    color: var(--navy-dark);
    line-height: 1.35;
  }
  .insight-card-title.important::before { content: "⭐ "; }
  .insight-card-summary {
    font-size: 13px; color: var(--text); opacity: .75;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.5;
  }
  .insight-card-meta {
    display: flex; align-items: center; gap: 10px;
    margin-top: auto;
    font-size: 11.5px; color: var(--muted);
    flex-wrap: wrap;
  }
  .insight-card-date { font-weight: 600; white-space: nowrap; }
  .insight-card-tags { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .insight-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: var(--navy-soft); color: var(--navy-dark);
    border: 1px solid rgba(18,65,145,.18);
    font-weight: 500; white-space: nowrap;
  }

  /* Inline reader overlay + slide-in panel */
  .reader-overlay {
    position: fixed; inset: 0;
    background: rgba(0,21,53,.42);
    z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .reader-overlay.open { opacity: 1; pointer-events: auto; }
  .reader-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(840px, 94vw);
    background: #fff;
    box-shadow: -8px 0 40px rgba(0,21,53,.22);
    z-index: 51;
    transform: translateX(100%);
    transition: transform .25s ease-out;
    display: flex; flex-direction: column;
  }
  .reader-panel.open { transform: translateX(0); }
  .reader-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    flex-shrink: 0;
  }
  .reader-back, .reader-action {
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 6px 12px;
    font: inherit; font-size: 13px; color: var(--muted);
    cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 5px;
    transition: color .12s, border-color .12s, background .12s;
  }
  .reader-back:hover, .reader-action:hover {
    color: var(--navy-dark); border-color: var(--navy); background: var(--navy-soft);
  }
  .reader-title-bar {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .reader-title-label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .reader-title-text {
    font-size: 14px; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .reader-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .reader-body {
    flex: 1; overflow-y: auto;
    padding: 36px 56px 80px;
    line-height: 1.65; color: var(--text); font-size: 15px;
  }
  @media (max-width: 720px) { .reader-body { padding: 24px 22px 60px; } }
  .reader-body h1 { font-size: 28px; margin: 0 0 14px; color: var(--navy-dark); line-height: 1.25; }
  .reader-body h2 { font-size: 21px; margin: 30px 0 10px; color: var(--navy-dark); padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .reader-body h3 { font-size: 17px; margin: 22px 0 8px; color: var(--text); }
  .reader-body h4 { font-size: 15px; margin: 18px 0 6px; color: var(--text); }
  .reader-body p { margin: 10px 0 12px; }
  .reader-body ul, .reader-body ol { padding-left: 24px; margin: 8px 0 14px; }
  .reader-body li { margin: 5px 0; }
  .reader-body li > p { margin: 4px 0; }
  .reader-body code {
    background: var(--panel-2); padding: 1px 6px; border-radius: 4px;
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 13px;
    border: 1px solid var(--border);
  }
  .reader-body pre {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; overflow-x: auto;
    margin: 14px 0; font-size: 13px;
  }
  .reader-body pre code { background: transparent; border: none; padding: 0; }
  .reader-body blockquote {
    border-left: 3px solid var(--navy); margin: 14px 0;
    padding: 8px 18px; color: var(--text);
    background: var(--navy-tint); border-radius: 0 8px 8px 0;
  }
  .reader-body blockquote p { margin: 4px 0; }
  .reader-body a {
    color: var(--navy); text-decoration: none;
    border-bottom: 1px solid rgba(18,65,145,.3);
    transition: border-color .12s;
  }
  .reader-body a:hover { border-bottom-color: var(--navy); }
  .reader-body table {
    border-collapse: collapse; width: 100%;
    margin: 14px 0; font-size: 13.5px;
  }
  .reader-body th, .reader-body td {
    border: 1px solid var(--border); padding: 8px 12px; text-align: left;
    vertical-align: top;
  }
  .reader-body th {
    background: var(--panel-2); font-weight: 700; color: var(--navy-dark);
  }
  .reader-body img { max-width: 100%; border-radius: 8px; }
  .reader-body hr {
    border: none; border-top: 1px solid var(--border); margin: 24px 0;
  }
  .reader-body input[type=checkbox] { margin-right: 6px; }
  .reader-tags-row {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .reader-date-row {
    color: var(--muted); font-size: 13px; margin-bottom: 4px;
    font-weight: 600;
  }
  .reader-loading, .reader-error {
    padding: 60px 20px; text-align: center; color: var(--muted);
  }
  .reader-error { color: var(--danger); }
  .box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px 18px 18px;
    display: flex; flex-direction: column; gap: 8px;
    text-decoration: none; color: var(--text);
    transition: transform .12s, border-color .12s, box-shadow .12s;
    min-height: 130px;
    position: relative; overflow: hidden;
  }
  .box::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--navy); opacity: 0; transition: opacity .15s;
  }
  .box:hover {
    transform: translateY(-2px);
    border-color: var(--navy);
    box-shadow: var(--shadow);
  }
  .box:hover::after { opacity: 1; }
  .box .box-icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--navy-soft); color: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .box .box-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .box .box-sub { font-size: 12px; color: var(--muted); margin-top: auto; }
  .list-section { margin-bottom: 28px; }
  .list-section h3 {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
    margin: 0 0 10px;
  }
  .list-items {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; text-decoration: none; color: var(--text);
    border-bottom: 1px solid var(--border);
    transition: background .12s;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item:hover { background: var(--navy-tint); }
  .list-item .li-icon {
    color: var(--navy); font-size: 16px;
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--navy-soft);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .list-item .li-title { flex: 1; font-weight: 500; }
  .list-item .li-arrow { color: var(--muted); font-size: 14px; }
  .notion-hero {
    background: linear-gradient(135deg, var(--brand-blue) 0%, var(--navy-dark) 100%);
    color: white; border-radius: 14px;
    padding: 28px 28px 24px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .notion-hero h2 { font-family: var(--font-headline); }

  /* Sync actions moved to bottom of tab */
  .tab-footer-actions {
    display: flex; gap: 10px; justify-content: flex-end;
    margin-top: 36px; padding: 18px 0;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .tab-footer-actions .hero-btn {
    background: var(--panel-2); color: var(--navy-dark);
    border: 1px solid var(--border-strong);
    padding: 9px 16px; border-radius: 8px;
    text-decoration: none; font-weight: 500; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .12s;
  }
  .tab-footer-actions .hero-btn:hover {
    border-color: var(--brand-blue); color: var(--brand-blue);
    background: var(--navy-soft);
    transform: translateY(-1px);
  }
  .tab-footer-actions .hero-btn.primary {
    background: var(--brand-blue); color: white;
    border-color: var(--brand-blue);
  }
  .tab-footer-actions .hero-btn.primary:hover {
    background: var(--navy-deep); border-color: var(--navy-deep);
    color: white;
  }
  .notion-hero h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .notion-hero p { margin: 0; opacity: 0.85; font-size: 13.5px; }
  .notion-hero .hero-icon {
    width: 56px; height: 56px; border-radius: 12px;
    background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .notion-hero .hero-text { flex: 1; min-width: 220px; }
  .notion-hero .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .notion-hero .hero-btn {
    background: white; color: var(--navy-dark);
    padding: 10px 18px; border-radius: 8px;
    text-decoration: none; font-weight: 600; font-size: 13.5px;
    transition: transform .12s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .notion-hero .hero-btn.secondary {
    background: rgba(255,255,255,.15); color: white;
    border: 1px solid rgba(255,255,255,.3);
  }
  .notion-hero .hero-btn:hover { transform: translateY(-1px); }
  .filter-bar {
    margin-bottom: 14px;
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  }
  .filter-bar .filter-label {
    font-size: 11.5px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-right: 4px;
  }
  .filter-chip {
    font-size: 12px; padding: 4px 10px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; user-select: none;
    transition: all .12s;
  }
  .filter-chip:hover { border-color: var(--navy); }
  .filter-chip.active {
    background: var(--navy); color: white; border-color: var(--navy);
    font-weight: 500;
  }
  .filter-chip.clear { color: var(--muted); border-style: dashed; }
  .filter-chip.clear:hover { color: var(--danger); border-color: var(--danger); }
  .proj-row .row-edited {
    font-size: 11px; color: var(--muted);
    margin-left: auto; white-space: nowrap;
  }
  .proj-group { margin-bottom: 22px; }
  .proj-group h3 {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
    margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .proj-group h3 .grp-count {
    font-size: 11px; padding: 1px 7px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); letter-spacing: 0;
  }
  .proj-table {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .proj-row {
    display: block;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    text-decoration: none; color: var(--text);
    transition: background .12s;
  }
  .proj-row:last-child { border-bottom: none; }
  .proj-row:hover { background: var(--navy-tint); }
  .proj-row .row-top {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .proj-row .pname {
    font-weight: 600; font-size: 14px; flex: 1; min-width: 180px;
  }
  .proj-row .row-meta {
    margin-top: 4px; font-size: 12px; color: var(--muted);
  }
  .proj-row .row-meta .dot { margin: 0 6px; opacity: 0.5; }
  .proj-row .row-update {

<body>

<header>
  <div class="header-row">
    <div class="brand">
      <img class="logo-svg" src="assets/nokia-logo.svg" alt="Nokia" />
      <span class="brand-divider"></span>
      <span class="app-name">Nexus</span>
      <span class="app-tag">QUANGLDN</span>
    </div>
    <input id="search" type="search" placeholder="Search this tab…  (Ctrl+K)" autocomplete="off" />
    <span class="meta" id="meta"></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div id="errors"></div>

<main id="main"></main>

<footer>
  <span>Edits land in GitHub. Refresh the page after a push to pull the latest <kbd>data.json</kbd>.</span>
  <span id="last-edited"></span>
</footer>

<div id="toast"></div>

<script>
(async function () {
  const tabsEl = document.getElementById('tabs');
  const mainEl = document.getElementById('main');
  const metaEl = document.getElementById('meta');
  const lastEd = document.getElementById('last-edited');
  const errors = document.getElementById('errors');
  const toast = document.getElementById('toast');

  function showError(msg) {
    const div = document.createElement('div');
    div.className = 'error-banner';
    div.textContent = msg;
    errors.appendChild(div);
  }
  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function escapeAttr(s) { return escapeHtml(s); }
  // ===== Pins/Docs storage helpers (key-parameterized, shared by My Pins view and My Docs tab) =====
  const pinsUid = pfx => pfx + Math.random().toString(36).slice(2, 9);
  function makeDefaultPinsPage(name) {
    return { id: pinsUid('pg_'), name: name || 'Homepage', blocks: [
      { id: pinsUid('b_'), name: 'Quick links', links: [] }
    ]};
  }
  function normalizePinsState(state) {
    if (!state || !Array.isArray(state.pages) || state.pages.length === 0) {
      const pg = makeDefaultPinsPage('Homepage');
      return { pages: [pg], activePage: pg.id };
    }
    state.pages.forEach(pg => {
      if (!pg.id) pg.id = pinsUid('pg_');
      if (!pg.name) pg.name = 'Untitled';
      if (!Array.isArray(pg.blocks)) pg.blocks = [];
    });
    if (!state.activePage || !state.pages.find(p => p.id === state.activePage)) {
      state.activePage = state.pages[0].id;
    }
    return state;
  }
  function loadPinsState(key) {
    try {
      const raw = localStorage.getItem(key);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.pages)) return normalizePinsState(parsed);
        if (parsed && Array.isArray(parsed.blocks)) {
          const pg = { id: pinsUid('pg_'), name: 'Homepage', blocks: parsed.blocks };
          return { pages: [pg], activePage: pg.id };
        }
      }
    } catch (e) {}
    const pg = makeDefaultPinsPage('Homepage');
    return { pages: [pg], activePage: pg.id };
  }
  function savePinsState(key, state) {
    try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {}
  }
  function pinsTotalFor(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return 0;
      const p = JSON.parse(raw);
      if (Array.isArray(p.pages)) {
        return p.pages.reduce((s, pg) =>
          s + (pg.blocks || []).reduce((s2, b) => s2 + (b.links || []).length, 0), 0);
      }
      return (p.blocks || []).reduce((s, b) => s + (b.links || []).length, 0);
    } catch (e) { return 0; }
  }
  function detectLinkKind(raw) {
    let s = (raw || '').trim();
    s = s.replace(/^["']+|["']+$/g, '').trim();
    if (!s) return null;
    if (/^https?:\/\//i.test(s)) return { kind: 'web', value: s };
    if (/^file:\/\//i.test(s)) {
      let p = decodeURIComponent(s.replace(/^file:\/+/i, ''));
      if (/^[a-z]:/i.test(p)) p = p.replace(/\//g, '\\');
      return { kind: 'local', value: p };
    }
    if (/^[a-z]:[\\\/]/i.test(s)) return { kind: 'local', value: s.replace(/\//g, '\\') };
    if (/^\\\\/.test(s)) return { kind: 'local', value: s };
    if (/^[\w.-]+\.[a-z]{2,}([\/?#]|$)/i.test(s)) return { kind: 'web', value: 'https://' + s };
    return { kind: 'web', value: s };
  }
  function localIcon(p) {
    const lower = (p || '').toLowerCase();
    if (/\.docx?$/.test(lower)) return '📘';
    if (/\.(xlsx?|csv)$/.test(lower)) return '📗';
    if (/\.pptx?$/.test(lower)) return '📙';
    if (/\.pdf$/.test(lower)) return '📕';
    if (/\.(bat|cmd|exe|ps1|sh)$/.test(lower)) return '⚙️';
    if (/\.(txt|md|log|ini|cfg)$/.test(lower)) return '📝';
    if (/\.(zip|7z|rar|tar|gz)$/.test(lower)) return '🗜️';
    if (/\.(png|jpe?g|gif|bmp|webp|svg)$/.test(lower)) return '🖼️';
    if (/\.(mp4|mov|avi|mkv)$/.test(lower)) return '🎬';
    if (/\.(mp3|wav|flac|m4a)$/.test(lower)) return '🎵';
    if (!/\.[a-z0-9]{1,5}$/i.test(p) || /[\\\/]$/.test(p)) return '📁';
    return '📄';
  }
  function defaultLocalTitle(p) {
    const clean = (p || '').replace(/[\\\/]+$/, '');
    const seg = clean.split(/[\\\/]/).filter(Boolean).pop();
    return seg || clean;
  }

  // ===== renderPinsUI: shared multi-page drag-drop scratchpad UI.
  // Used by both Products Wiki → My Pins view AND My Docs tab.
  // opts = { storageKey, onChange?, exportPrefix? }
  function renderPinsUI(content, opts) {
    const options = opts || {};
    const STORAGE = options.storageKey || 'nexus.pins';
    const ON_CHANGE = options.onChange || (() => {});
    const EXPORT_PREFIX = options.exportPrefix || 'nexus-pins';
    let state = loadPinsState(STORAGE);
    const currentPage = () => state.pages.find(p => p.id === state.activePage) || state.pages[0];
    const save = () => savePinsState(STORAGE, state);

    const pageBar = document.createElement('div');
    pageBar.className = 'pages-bar';
    content.appendChild(pageBar);

    const toolbar = document.createElement('div');
    toolbar.className = 'pins-toolbar';
    toolbar.innerHTML = `
      <button class="pins-btn" data-act="addlink" type="button" title="Add a web link or a local file/folder path">+ Add link</button>
      <button class="pins-btn ghost" data-act="addblock" type="button">+ Add block</button>
      <button class="pins-btn ghost" data-act="export" type="button" title="Download backup JSON (all pages)">⬇ Export</button>
      <button class="pins-btn ghost" data-act="import" type="button" title="Restore from a backup JSON">⬆ Import</button>
      <span class="pins-hint">Drag a tab from Edge onto a block, or use + Add link for local files.</span>
    `;
    content.appendChild(toolbar);

    const addForm = document.createElement('div');
    addForm.className = 'pin-add-form';
    addForm.innerHTML = `
      <input type="text" data-fld="input" placeholder="Paste URL or path… e.g. https://… or C:\\Users\\… or \\\\server\\share" autocomplete="off" />
      <input type="text" data-fld="title" placeholder="Title (optional)" style="flex: 0 1 200px; min-width: 140px;" />
      <select data-fld="block"></select>
      <button class="pins-btn" data-fld="go" type="button">Add</button>
      <button class="pins-btn ghost" data-fld="cancel" type="button">Cancel</button>
      <div class="form-hint">
        Web: <code>https://...</code> · Local file: <code>C:\\path\\file.xlsx</code> (right-click in Explorer → <em>Copy as path</em>) · Folder: <code>C:\\path\\</code> · Network: <code>\\\\server\\share</code>. Local entries copy the path to clipboard on click (Edge blocks <code>file://</code> from HTTPS).
      </div>
    `;
    content.appendChild(addForm);

    const grid = document.createElement('div');
    grid.className = 'pins-grid';
    content.appendChild(grid);

    function paintPageBar() {
      pageBar.innerHTML = '';
      state.pages.forEach(pg => {
        const tab = document.createElement('div');
        tab.className = 'page-tab' + (pg.id === state.activePage ? ' active' : '');
        const cnt = (pg.blocks || []).reduce((s, b) => s + (b.links || []).length, 0);
        tab.innerHTML = `${escapeHtml(pg.name)}<span class="pg-count">${cnt}</span>`;
        tab.title = 'Click to switch · Double-click to rename';
        tab.addEventListener('click', () => {
          if (state.activePage === pg.id) return;
          state.activePage = pg.id;
          save();
          paintPageBar();
          paint();
        });
        tab.addEventListener('dblclick', () => {
          const n = prompt('Rename page:', pg.name);
          if (n !== null) { pg.name = n.trim() || 'Untitled'; save(); paintPageBar(); }
        });
        pageBar.appendChild(tab);
      });

      const addPageBtn = document.createElement('button');
      addPageBtn.className = 'page-add';
      addPageBtn.type = 'button';
      addPageBtn.textContent = '+ New page';
      addPageBtn.addEventListener('click', () => {
        const n = prompt('Page name:', 'New page');
        if (n === null) return;
        const newPg = { id: pinsUid('pg_'), name: n.trim() || 'Untitled', blocks: [] };
        state.pages.push(newPg);
        state.activePage = newPg.id;
        save();
        paintPageBar();
        paint();
      });
      pageBar.appendChild(addPageBtn);

      const actions = document.createElement('div');
      actions.className = 'page-actions';
      const renameBtn = document.createElement('button');
      renameBtn.className = 'page-action-btn';
      renameBtn.type = 'button';
      renameBtn.textContent = '✏ Rename';
      renameBtn.title = 'Rename current page';
      renameBtn.addEventListener('click', () => {
        const cur = currentPage();
        if (!cur) return;
        const n = prompt('Rename page:', cur.name);
        if (n !== null) { cur.name = n.trim() || 'Untitled'; save(); paintPageBar(); }
      });
      actions.appendChild(renameBtn);

      const delPageBtn = document.createElement('button');
      delPageBtn.className = 'page-action-btn danger';
      delPageBtn.type = 'button';
      delPageBtn.textContent = '🗑 Delete page';
      delPageBtn.title = 'Delete current page';
      delPageBtn.addEventListener('click', () => {
        const cur = currentPage();
        if (!cur) return;
        if (state.pages.length === 1) { showToast('Cannot delete the last page — add another first'); return; }
        const links = (cur.blocks || []).reduce((s, b) => s + (b.links || []).length, 0);
        const blocks = (cur.blocks || []).length;
        if (!confirm(`Delete page "${cur.name}" (${blocks} block${blocks !== 1 ? 's' : ''}, ${links} pinned link${links !== 1 ? 's' : ''})?`)) return;
        state.pages = state.pages.filter(p => p.id !== cur.id);
        state.activePage = state.pages[0].id;
        save();
        ON_CHANGE();
        paintPageBar();
        paint();
      });
      actions.appendChild(delPageBtn);
      pageBar.appendChild(actions);
    }

    function paint() {
      grid.innerHTML = '';
      const cur = currentPage();
      if (!cur) return;
      cur.blocks = cur.blocks || [];
      cur.blocks.forEach(block => {
        const bEl = document.createElement('div');
        bEl.className = 'pin-block';
        bEl.dataset.blockId = block.id;

        const head = document.createElement('div');
        head.className = 'pin-block-head';
        const nameInput = document.createElement('input');
        nameInput.className = 'pin-block-name';
        nameInput.type = 'text';
        nameInput.value = block.name || '';
        nameInput.placeholder = 'Block name';
        nameInput.addEventListener('change', () => { block.name = nameInput.value.trim() || 'Untitled'; save(); });
        nameInput.addEventListener('dragstart', e => e.stopPropagation());
        head.appendChild(nameInput);

        const delBtn = document.createElement('span');
        delBtn.className = 'pin-block-del';
        delBtn.textContent = '🗑';
        delBtn.title = 'Delete block';
        delBtn.addEventListener('click', () => {
          const n = (block.links || []).length;
          const msg = n > 0
            ? `Delete block "${block.name}" and its ${n} pinned link${n > 1 ? 's' : ''}?`
            : `Delete block "${block.name}"?`;
          if (confirm(msg)) {
            cur.blocks = cur.blocks.filter(b => b.id !== block.id);
            save(); ON_CHANGE(); paintPageBar(); paint();
          }
        });
        head.appendChild(delBtn);
        bEl.appendChild(head);

        const list = document.createElement('div');
        list.className = 'pin-list';
        if (!block.links || block.links.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'pin-empty';
          empty.textContent = 'Drop link here';
          list.appendChild(empty);
        } else {
          block.links.forEach(link => {
            const a = document.createElement(link.local ? 'button' : 'a');
            a.className = 'pin-item' + (link.local ? ' local' : '');
            if (link.local) { a.type = 'button'; }
            else { a.href = link.url; a.target = '_blank'; a.rel = 'noopener'; }
            a.draggable = true;
            a.dataset.linkId = link.id;
            a.dataset.search = ((link.title || '') + ' ' + (link.url || '') + ' ' + (link.host || '')).toLowerCase();
            const kindIcon = link.local ? localIcon(link.url) : (link.icon || '🔗');
            const hostLabel = link.local ? 'click to copy path' : (link.host || '');
            a.innerHTML = `
              <span class="pin-kind">${escapeHtml(kindIcon)}</span>
              <span class="pin-title" title="${escapeAttr(link.url)}">${escapeHtml(link.title || link.url)}</span>
              <span class="pin-host">${escapeHtml(hostLabel)}</span>
              <span class="pin-x" title="Remove">✕</span>
            `;
            if (link.local) {
              a.addEventListener('click', e => {
                if (e.target.closest('.pin-x')) return;
                e.preventDefault();
                copyToClipboard(link.url);
              });
            }
            a.addEventListener('contextmenu', e => {
              e.preventDefault();
              const nt = prompt('Rename link:', link.title || '');
              if (nt !== null) { link.title = nt.trim() || link.url; save(); paint(); }
            });
            a.querySelector('.pin-x').addEventListener('click', e => {
              e.preventDefault();
              e.stopPropagation();
              block.links = block.links.filter(l => l.id !== link.id);
              save(); ON_CHANGE(); paintPageBar(); paint();
            });
            a.addEventListener('dragstart', e => {
              e.dataTransfer.setData('application/x-nexus-pin', JSON.stringify({ blockId: block.id, linkId: link.id, storage: STORAGE }));
              e.dataTransfer.effectAllowed = 'move';
              a.classList.add('dragging');
            });
            a.addEventListener('dragend', () => a.classList.remove('dragging'));
            list.appendChild(a);
          });
        }
        bEl.appendChild(list);

        bEl.addEventListener('dragover', e => {
          e.preventDefault();
          bEl.classList.add('drag-over');
          const isInternal = e.dataTransfer.types.includes('application/x-nexus-pin');
          e.dataTransfer.dropEffect = isInternal ? 'move' : 'copy';
        });
        bEl.addEventListener('dragleave', e => {
          if (e.target === bEl || !bEl.contains(e.relatedTarget)) {
            bEl.classList.remove('drag-over');
          }
        });
        bEl.addEventListener('drop', e => {
          e.preventDefault();
          bEl.classList.remove('drag-over');

          const internal = e.dataTransfer.getData('application/x-nexus-pin');
          if (internal) {
            try {
              const payload = JSON.parse(internal);
              // Only allow internal moves within the same storage (same tab)
              if (payload.storage && payload.storage !== STORAGE) return;
              if (payload.blockId === block.id) return;
              const src = cur.blocks.find(b => b.id === payload.blockId);
              if (!src) return;
              const idx = (src.links || []).findIndex(l => l.id === payload.linkId);
              if (idx < 0) return;
              const [moved] = src.links.splice(idx, 1);
              block.links = block.links || [];
              block.links.push(moved);
              save(); paint();
            } catch (err) {}
            return;
          }

          const uri = e.dataTransfer.getData('text/uri-list') || '';
          const plain = e.dataTransfer.getData('text/plain') || '';
          const html = e.dataTransfer.getData('text/html') || '';
          const raw = uri || plain;
          const urls = raw.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith('#'));
          if (urls.length === 0) { showToast('No URL detected in drop'); return; }

          let titleFromHtml = '';
          if (html) {
            const m = html.match(/<a[^>]*>([\s\S]*?)<\/a>/i);
            if (m) {
              const tmp = document.createElement('div');
              tmp.innerHTML = m[1];
              titleFromHtml = (tmp.textContent || '').trim();
            }
          }

          let added = 0;
          urls.forEach(u => {
            const det = detectLinkKind(u);
            if (!det) return;
            let host = '', defaultTitle = det.value;
            if (det.kind === 'web') {
              try {
                const parsed = new URL(det.value);
                host = parsed.hostname.replace(/^www\./, '');
                const lastSeg = parsed.pathname.split('/').filter(Boolean).pop();
                defaultTitle = lastSeg ? decodeURIComponent(lastSeg).replace(/[-_+]/g, ' ') : host;
              } catch (err) { return; }
            } else {
              defaultTitle = defaultLocalTitle(det.value);
            }
            block.links = block.links || [];
            block.links.push({
              id: pinsUid('p_'),
              title: titleFromHtml || defaultTitle,
              url: det.value, host: host,
              local: det.kind === 'local',
              added: new Date().toISOString(),
            });
            added++;
          });
          if (added > 0) {
            save(); ON_CHANGE(); paintPageBar(); paint();
            showToast('Pinned ' + added + ' link' + (added > 1 ? 's' : '') + ' to "' + (block.name || 'block') + '"');
          } else {
            showToast('Could not parse a URL from the drop');
          }
        });

        grid.appendChild(bEl);
      });
    }

    paintPageBar();
    paint();

    toolbar.querySelector('[data-act="addblock"]').addEventListener('click', () => {
      const cur = currentPage();
      cur.blocks = cur.blocks || [];
      cur.blocks.push({ id: pinsUid('b_'), name: 'New block', links: [] });
      save(); paintPageBar(); paint();
    });

    // === Add link form wiring ===
    const addLinkBtn = toolbar.querySelector('[data-act="addlink"]');
    const addInput = addForm.querySelector('[data-fld="input"]');
    const addTitle = addForm.querySelector('[data-fld="title"]');
    const addBlockSel = addForm.querySelector('[data-fld="block"]');
    function refreshBlockSelect() {
      const cur = currentPage();
      addBlockSel.innerHTML = '';
      (cur.blocks || []).forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.id;
        opt.textContent = '→ ' + (b.name || 'Untitled');
        addBlockSel.appendChild(opt);
      });
      if (!cur.blocks || cur.blocks.length === 0) {
        const opt = document.createElement('option');
        opt.value = '__new__';
        opt.textContent = '→ (creates "Quick links")';
        addBlockSel.appendChild(opt);
      }
    }
    function openAddForm() {
      refreshBlockSelect();
      addForm.classList.add('open');
      addInput.value = ''; addTitle.value = '';
      setTimeout(() => addInput.focus(), 0);
    }
    function closeAddForm() { addForm.classList.remove('open'); }
    function submitAddLink() {
      const det = detectLinkKind(addInput.value);
      if (!det) { showToast('Paste a URL or path first'); addInput.focus(); return; }
      const cur = currentPage();
      cur.blocks = cur.blocks || [];
      let targetBlock;
      if (addBlockSel.value === '__new__' || cur.blocks.length === 0) {
        targetBlock = { id: pinsUid('b_'), name: 'Quick links', links: [] };
        cur.blocks.push(targetBlock);
      } else {
        targetBlock = cur.blocks.find(b => b.id === addBlockSel.value) || cur.blocks[0];
      }
      let title = (addTitle.value || '').trim();
      let host = '';
      if (det.kind === 'web') {
        try { host = new URL(det.value).hostname.replace(/^www\./, ''); } catch (e) {}
        if (!title) {
          try {
            const u = new URL(det.value);
            const lastSeg = u.pathname.split('/').filter(Boolean).pop();
            title = lastSeg ? decodeURIComponent(lastSeg).replace(/[-_+]/g, ' ') : host;
          } catch (e) { title = det.value; }
        }
      } else {
        if (!title) title = defaultLocalTitle(det.value);
      }
      targetBlock.links = targetBlock.links || [];
      targetBlock.links.push({
        id: pinsUid('p_'),
        title: title || det.value,
        url: det.value, host: host,
        local: det.kind === 'local',
        added: new Date().toISOString(),
      });
      save(); ON_CHANGE(); paintPageBar(); paint();
      showToast((det.kind === 'local' ? 'Pinned local: ' : 'Pinned: ') + (title || det.value));
      closeAddForm();
    }
    addLinkBtn.addEventListener('click', () => {
      if (addForm.classList.contains('open')) closeAddForm(); else openAddForm();
    });
    addForm.querySelector('[data-fld="go"]').addEventListener('click', submitAddLink);
    addForm.querySelector('[data-fld="cancel"]').addEventListener('click', closeAddForm);
    addInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submitAddLink(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeAddForm(); }
    });
    addTitle.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submitAddLink(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeAddForm(); }
    });
    toolbar.querySelector('[data-act="export"]').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = EXPORT_PREFIX + '-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    });
    toolbar.querySelector('[data-act="import"]').addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'application/json,.json';
      inp.addEventListener('change', () => {
        const file = inp.files && inp.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            let next;
            if (parsed && Array.isArray(parsed.pages)) {
              next = normalizePinsState(parsed);
            } else if (parsed && Array.isArray(parsed.blocks)) {
              const pg = { id: pinsUid('pg_'), name: 'Imported', blocks: parsed.blocks };
              next = { pages: [pg], activePage: pg.id };
            } else { throw new Error('Bad format'); }
            if (!confirm('Replace current data with imported?')) return;
            state = next;
            save(); ON_CHANGE(); paintPageBar(); paint();
            showToast('Imported');
          } catch (e) { showToast('Import failed: ' + (e.message || e)); }
        };
        reader.readAsText(file);
      });
      inp.click();
    });
  }

  // ===== My Docs tab: localStorage-only personal docs scratch-pad (Nokia laptop). =====
  function renderDocs(t) {
    const wrap = document.createElement('div');
    const hero = document.createElement('div');
    hero.className = 'notion-hero';
    hero.innerHTML = `
      <div class="hero-icon">📁</div>
      <div class="hero-text">
        <h2>${escapeHtml(t.heroTitle || 'My Docs')}</h2>
        <p>${escapeHtml(t.heroText || '')}</p>
      </div>
    `;
    wrap.appendChild(hero);
    const content = document.createElement('div');
    wrap.appendChild(content);
    renderPinsUI(content, { storageKey: 'nexus.docs', exportPrefix: 'nexus-docs' });
    return wrap;
  }

  // Sync/Notion action buttons rendered at the BOTTOM of a tab (instead of in the hero).
  function appendSyncFooter(wrap, t) {
    if (!t.syncWorkflowUrl && !t.notionUrl) return;
    const footer = document.createElement('div');
    footer.className = 'tab-footer-actions';
    let html = '';
    if (t.syncWorkflowUrl) {
      html += `<a href="${escapeAttr(t.syncWorkflowUrl)}" target="_blank" rel="noopener" class="hero-btn" title="Opens GitHub Actions in a new tab">🔄 Run sync now</a>`;
    }
    if (t.notionUrl) {
      html += `<a href="${escapeAttr(t.notionUrl)}" target="_blank" rel="noopener" class="hero-btn primary">Open in Notion ↗</a>`;
    }
    footer.innerHTML = html;
    wrap.appendChild(footer);
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
  }
  async function copyToClipboard(text) {
    try {
      if (navigator.clipboard) await navigator.clipboard.writeText(text);
      else {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      showToast('Path copied — paste in File Explorer');
    } catch (e) { showToast('Copy failed: ' + (e.message || e)); }
  }
  async function loadJson(path) {
    try {
      const res = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      showError('Could not load ' + path + ' — ' + (e.message || e));
      return null;
    }
  }

  const [data, notion, documents] = await Promise.all([
    loadJson('data.json'),
    loadJson('notion-projects.json'),
    loadJson('notion-documents.json')
  ]);
  if (!data) { showError('Cannot continue without data.json.'); return; }

  // Tag → CSS chip-class lookup (used by renderDocRow). Must be declared BEFORE
  // tabs.forEach below to avoid temporal-dead-zone error when the Products Wiki
  // tab renders.
  const TAG_CATEGORY = {
    'Exec Overview': 'tag-doctype', 'Deep Dive': 'tag-doctype', 'Sales Presentation': 'tag-doctype',
    'Datasheet': 'tag-doctype', 'Whitepaper': 'tag-doctype', 'Application Note': 'tag-doctype',
    'GRTS': 'tag-doctype', 'Release Notes': 'tag-doctype', 'Roadmap': 'tag-doctype',
    'Pricing & Licensing': 'tag-doctype', 'Case Study': 'tag-doctype', 'Visio Stencil': 'tag-doctype',
    'Customer-facing': 'tag-audience', 'Internal': 'tag-audience', 'Partner': 'tag-audience',
    'Competitive Intel': 'tag-audience',
    'DCI': 'tag-topic', 'Subsea': 'tag-topic', 'Long Haul': 'tag-topic',
    'Metro': 'tag-topic', 'Mission Critical': 'tag-topic', 'Sustainability': 'tag-topic',
    'AI / Data Center': 'tag-topic', '5G / Mobile': 'tag-topic',
    'Demo Video': 'tag-tech', 'Webinar': 'tag-tech',
    'Quantum-Safe': 'tag-tech', 'Fiber Sensing': 'tag-tech', 'Automation': 'tag-tech',
    'Pluggables': 'tag-tech', 'OTN': 'tag-tech', 'Sync / Timing': 'tag-tech',
    'IP-Optical': 'tag-tech', 'ROADM': 'tag-tech',
  };

  const tabs = data.tabs || [];
  tabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.dataset.tab = t.id;
    btn.innerHTML = `<span class="tab-icon">${escapeHtml(t.icon || '')}</span>${escapeHtml(t.name)}`;
    tabsEl.appendChild(btn);

    const panel = document.createElement('section');
    panel.className = 'panel' + (i === 0 ? ' active' : '');
    panel.id = 'panel-' + t.id;
    panel.appendChild(renderTab(t));
    mainEl.appendChild(panel);
  });

  const saved = localStorage.getItem('nexus.activeTab');
  if (saved && document.querySelector(`.tab[data-tab="${saved}"]`)) {
    activateTab(saved);
  }

  function activateTab(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
    localStorage.setItem('nexus.activeTab', id);
    document.getElementById('search').value = '';
    document.getElementById('search').dispatchEvent(new Event('input'));
  }

  tabsEl.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (btn) activateTab(btn.dataset.tab);
  });

  function renderTab(t) {
    const frag = document.createDocumentFragment();
    if (t.type === 'boxes') frag.appendChild(renderBoxes(t.links || []));
    else if (t.type === 'blocks') frag.appendChild(renderBlocks(t));
    else if (t.type === 'list') frag.appendChild(renderList(t.groups || [{ name: '', links: t.links || [] }]));
    else if (t.type === 'notion') frag.appendChild(renderNotion(t));
    else if (t.type === 'documents') frag.appendChild(renderDocuments(t));
    else if (t.type === 'insights') frag.appendChild(renderInsights(t));
    else if (t.type === 'docs') frag.appendChild(renderDocs(t));
    else frag.appendChild(renderList([{ name: '', links: t.links || [] }]));
    return frag;
  }

  // ===== Insights tab: Notion-driven knowledge base with inline reader =====
  function renderInsights(t) {
    const wrap = document.createElement('div');

    const hero = document.createElement('div');
    hero.className = 'notion-hero';
    hero.innerHTML = `
      <div class="hero-icon">💡</div>
      <div class="hero-text">
        <h2>${escapeHtml(t.heroTitle || 'Insights')}</h2>
        <p>${escapeHtml(t.heroText || '')}</p>
      </div>
    `;
    wrap.appendChild(hero);

    const content = document.createElement('div');
    content.className = 'insights-content';
    wrap.appendChild(content);

    appendSyncFooter(wrap, t);

    // Async load posts index
    (async () => {
      let posts = [];
      let meta = null;
      try {
        const res = await fetch((t.indexFile || 'notion-posts.json') + '?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          meta = await res.json();
          posts = meta.posts || [];
        }
      } catch (e) {}

      if (!posts.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = `No insights yet.<br><br>Create a Knowledge Base DB in Notion (see <kbd>INSIGHTS-NOTION-SETUP.md</kbd>), publish a post, and trigger sync.`;
        content.appendChild(empty);
        return;
      }

      // Tag filter chips (multi-select OR)
      const allTags = new Set();
      posts.forEach(p => (p.tags || []).forEach(tg => allTags.add(tg)));

      let activeTags = new Set();
      try {
        const sav = JSON.parse(localStorage.getItem('nexus.insightsFilter') || '[]');
        activeTags = new Set(sav.filter(tg => allTags.has(tg)));
      } catch (e) {}

      const filterBar = document.createElement('div');
      filterBar.className = 'filter-bar';
      content.appendChild(filterBar);

      const grid = document.createElement('div');
      grid.className = 'insights-grid';
      content.appendChild(grid);

      function renderChips() {
        filterBar.innerHTML = '<span class="filter-label">Tag:</span>';
        [...allTags].sort().forEach(tg => {
          const chip = document.createElement('span');
          chip.className = 'filter-chip' + (activeTags.has(tg) ? ' active' : '');
          chip.textContent = tg;
          chip.addEventListener('click', () => {
            activeTags.has(tg) ? activeTags.delete(tg) : activeTags.add(tg);
            try { localStorage.setItem('nexus.insightsFilter', JSON.stringify([...activeTags])); } catch (e) {}
            renderChips();
            applyFilter();
          });
          filterBar.appendChild(chip);
        });
        if (activeTags.size > 0) {
          const clear = document.createElement('span');
          clear.className = 'filter-chip clear';
          clear.textContent = '✕ Clear';
          clear.addEventListener('click', () => {
            activeTags.clear();
            try { localStorage.removeItem('nexus.insightsFilter'); } catch (e) {}
            renderChips();
            applyFilter();
          });
          filterBar.appendChild(clear);
        }
      }
      function applyFilter() {
        const wanted = [...activeTags];
        grid.querySelectorAll('.insight-card').forEach(card => {
          if (wanted.length === 0) { card.classList.remove('hidden'); return; }
          const tags = (card.dataset.tags || '').split('||').filter(Boolean);
          const match = wanted.some(tg => tags.includes(tg));
          card.classList.toggle('hidden', !match);
        });
      }

      if (allTags.size > 0) renderChips();

      // Sort: important first, then date DESC
      const sorted = [...posts].sort((a, b) => {
        if ((b.important ? 1 : 0) !== (a.important ? 1 : 0)) return (b.important ? 1 : 0) - (a.important ? 1 : 0);
        return (b.date || '').localeCompare(a.date || '');
      });

      sorted.forEach(p => {
        const card = document.createElement('div');
        card.className = 'insight-card' + (p.important ? ' important' : '');
        const search = ((p.title || '') + ' ' + (p.summary || '') + ' ' + (p.tags || []).join(' ')).toLowerCase();
        card.dataset.search = search;
        card.dataset.tags = (p.tags || []).join('||');
        const tagsHtml = (p.tags || []).map(tg => `<span class="insight-tag">${escapeHtml(tg)}</span>`).join('');
        const dateHtml = p.date ? `<span class="insight-card-date">${escapeHtml(p.date)}</span>` : '';
        card.innerHTML = `
          <div class="insight-card-title${p.important ? ' important' : ''}">${escapeHtml(p.title || 'Untitled')}</div>
          <div class="insight-card-summary">${escapeHtml(p.summary || '')}</div>
          <div class="insight-card-meta">
            ${dateHtml}
            <div class="insight-card-tags">${tagsHtml}</div>
          </div>
        `;
        card.addEventListener('click', () => openInsightReader(p, t.postsFolder || 'posts'));
        grid.appendChild(card);
      });

      applyFilter();

      if (meta && meta.lastSync) {
        const sync = document.createElement('div');
        sync.style.cssText = 'margin-top:14px;font-size:11.5px;color:var(--muted)';
        sync.textContent = 'Last sync: ' + meta.lastSync + (meta.source ? ' · ' + meta.source : '');
        content.appendChild(sync);
      }
    })();

    return wrap;
  }

  // === Inline reader (slide-in panel) — used by Insights ===
  let _markedLoadPromise = null;
  function ensureMarked() {
    if (window.marked) return Promise.resolve();
    if (_markedLoadPromise) return _markedLoadPromise;
    _markedLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Cannot load marked.js (CDN blocked?)'));
      document.head.appendChild(s);
    });
    return _markedLoadPromise;
  }

  let _readerEls = null;
  function ensureReader() {
    if (_readerEls) return _readerEls;
    const overlay = document.createElement('div');
    overlay.className = 'reader-overlay';
    document.body.appendChild(overlay);

    const panel = document.createElement('div');
    panel.className = 'reader-panel';
    panel.innerHTML = `
      <div class="reader-header">
        <button class="reader-back" type="button">← Back</button>
        <div class="reader-title-bar">
          <div class="reader-title-label">Insights</div>
          <div class="reader-title-text"></div>
        </div>
        <div class="reader-actions">
          <a class="reader-action reader-notion-link" target="_blank" rel="noopener">Open in Notion ↗</a>
        </div>
      </div>
      <div class="reader-body"></div>
    `;
    document.body.appendChild(panel);

    const close = () => closeReader();
    overlay.addEventListener('click', close);
    panel.querySelector('.reader-back').addEventListener('click', close);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && panel.classList.contains('open')) close();
    });

    _readerEls = {
      overlay, panel,
      title: panel.querySelector('.reader-title-text'),
      body: panel.querySelector('.reader-body'),
      notionLink: panel.querySelector('.reader-notion-link')
    };
    return _readerEls;
  }
  function openReader() {
    const e = ensureReader();
    e.overlay.classList.add('open');
    e.panel.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeReader() {
    if (!_readerEls) return;
    _readerEls.overlay.classList.remove('open');
    _readerEls.panel.classList.remove('open');
    document.body.style.overflow = '';
  }
  async function openInsightReader(post, postsFolder) {
    const e = ensureReader();
    e.title.textContent = post.title || '';
    if (post.notionUrl) {
      e.notionLink.href = post.notionUrl;
      e.notionLink.style.display = '';
    } else {
      e.notionLink.style.display = 'none';
    }
    e.body.innerHTML = '<div class="reader-loading">Loading…</div>';
    openReader();

    let md = '';
    try {
      if (post.body) {
        md = post.body;
      } else if (post.bodyFile) {
        const path = post.bodyFile;
        const res = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status + ' fetching ' + path);
        md = await res.text();
      } else if (post.id) {
        const path = (postsFolder || 'posts') + '/' + post.id + '.md';
        const res = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status + ' fetching ' + path);
        md = await res.text();
      }
    } catch (err) {
      e.body.innerHTML = `<div class="reader-error">Failed to load: ${escapeHtml(err.message || String(err))}</div>`;
      return;
    }
    if (!md) {
      e.body.innerHTML = '<div class="reader-loading">No content yet. Click "Open in Notion" to view full page.</div>';
      return;
    }

    try {
      await ensureMarked();
    } catch (err) {
      // Fallback: show raw markdown as preformatted text
      e.body.innerHTML = `
        <div class="reader-error" style="margin-bottom: 12px; font-size: 12.5px;">marked.js failed to load — showing raw markdown.</div>
        <pre style="white-space: pre-wrap;">${escapeHtml(md)}</pre>
      `;
      return;
    }

    const tagsHtml = (post.tags || []).length > 0
      ? `<div class="reader-tags-row">${(post.tags || []).map(tg => `<span class="insight-tag">${escapeHtml(tg)}</span>`).join('')}</div>`
      : '';
    const dateHtml = post.date ? `<div class="reader-date-row">${escapeHtml(post.date)}</div>` : '';
    const html = window.marked.parse(md, { gfm: true, breaks: false });
    e.body.innerHTML = dateHtml + tagsHtml + html;
    e.body.scrollTop = 0;

    // Open external links in new tab
    e.body.querySelectorAll('a[href]').forEach(a => {
      a.target = '_blank';
      a.rel = 'noopener';
    });
  }

  // Reusable: render a single "home-block" card from a {name, icon, links: [...]} definition.

  function statusClass(status) {
    const s = (status || '').toLowerCase();
    if (s.includes('lost') || s.includes('cancel')) return 'status-lost';
    if (s.includes('complet') || s.includes('won') || s.includes('awarded')) return 'status-won';
    if (s.includes('deploy')) return 'status-deploy';
    if (s.includes('postpon') || s.includes('paus')) return 'status-paused';
    if (s.includes('plan') || s.includes('backlog') || s.includes('pend') || s.includes('wait')) return 'status-pending';
    return 'status-active';
  }
  function prioClass(p) {
    const x = (p || '').toLowerCase();
    if (x === 'high') return 'prio-high';
    if (x === 'medium') return 'prio-medium';
    if (x === 'low') return 'prio-low';
    return '';
  }
  function relativeTime(iso) {
    if (!iso) return '';
    const then = new Date(iso);
    if (isNaN(then.getTime())) return '';
    const now = new Date();
    const sec = Math.max(0, (now - then) / 1000);
    if (sec < 60) return 'just now';
    if (sec < 3600) return Math.floor(sec/60) + 'm ago';
    if (sec < 86400) return Math.floor(sec/3600) + 'h ago';
    if (sec < 86400 * 30) return Math.floor(sec/86400) + 'd ago';
    return then.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function projectCustomers(p) {
    if (!p.customer) return [];
    return p.customer.split(',').map(s => s.trim()).filter(Boolean);
  }

  function renderProjectRow(p) {
    const search = [p.name, p.status, p.customer, p.lineSystem, p.category, p.priority, p.keyUpdate, p.description]
      .filter(Boolean).join(' ').toLowerCase();
    const a = document.createElement('a');
    a.className = 'proj-row';
    a.href = p.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.dataset.search = search;
    a.dataset.customers = projectCustomers(p).join('||').toLowerCase();
    a.dataset.edited = p.lastEdited || '';

    const pills = [];
    if (p.priority) pills.push(`<span class="pill ${prioClass(p.priority)}">${escapeHtml(p.priority)}</span>`);
    if (p.status) pills.push(`<span class="pill ${statusClass(p.status)}">${escapeHtml(p.status)}</span>`);
    const edited = relativeTime(p.lastEdited);
    if (edited) pills.push(`<span class="row-edited" title="${escapeAttr(p.lastEdited || '')}">${escapeHtml(edited)}</span>`);

    const metaParts = [];
    if (p.customer) metaParts.push('👥 ' + escapeHtml(p.customer));
    if (p.lineSystem) metaParts.push('📡 ' + escapeHtml(p.lineSystem));
    if (p.bom) metaParts.push('📦 BoM: ' + escapeHtml(p.bom));
    if (p.projectType) metaParts.push(escapeHtml(p.projectType));
    const metaHtml = metaParts.length ? `<div class="row-meta">${metaParts.join('<span class="dot">·</span>')}</div>` : '';

    const updateText = p.keyUpdate || p.description || '';
    const updateHtml = updateText
      ? `<div class="row-update">${escapeHtml(updateText)}</div>`
      : '';

    let bomHtml = '';
    if (p.latestBom) {
      const filename = p.latestBom.split(/[\\\/]/).pop();
      bomHtml = `<div><span class="bom-chip" role="button" tabindex="0" data-path="${escapeAttr(p.latestBom)}" title="Click to copy full path:&#10;${escapeAttr(p.latestBom)}">
        <span class="bom-label">📦 Latest BOM</span>
        <span class="bom-file">${escapeHtml(filename)}</span>
      </span></div>`;
    }

    a.innerHTML = `
      <div class="row-top">
        <span class="pname">${escapeHtml(p.name)}</span>
        ${pills.join('')}
        <span class="row-arrow">→</span>
      </div>
      ${metaHtml}
      ${updateHtml}
      ${bomHtml}
    `;
    return a;
  }

  function renderNotion(t) {
    const wrap = document.createElement('div');
    const hero = document.createElement('div');
    hero.className = 'notion-hero';
    const heroCount = notion && Array.isArray(notion.projects) ? notion.projects.length : 0;
    hero.innerHTML = `
      <div class="hero-icon">📋</div>
      <div class="hero-text">
        <h2>${escapeHtml(t.heroTitle || 'Project Database')}${heroCount ? ` <span style="opacity:.7;font-weight:400;font-size:15px">· ${heroCount} active</span>` : ''}</h2>
        <p>${escapeHtml(t.heroText || 'Snapshot of your Notion DB. Open any row to jump into Notion.')}</p>
      </div>
    `;
    wrap.appendChild(hero);

    if (notion && Array.isArray(notion.projects) && notion.projects.length > 0) {
      const prioOrder = { 'high': 0, 'medium': 1, 'low': 2 };
      const editedEpoch = p => {
        if (!p.lastEdited) return 0;
        const d = new Date(p.lastEdited);
        return isNaN(d.getTime()) ? 0 : d.getTime();
      };
      const sorted = [...notion.projects].sort((a, b) => {
        const aE = editedEpoch(a), bE = editedEpoch(b);
        if (aE !== bE) return bE - aE;
        const aP = prioOrder[(a.priority || '').toLowerCase()] ?? 99;
        const bP = prioOrder[(b.priority || '').toLowerCase()] ?? 99;
        if (aP !== bP) return aP - bP;
        return (a.name || '').localeCompare(b.name || '');
      });

      const allCustomers = new Set();
      sorted.forEach(p => projectCustomers(p).forEach(c => allCustomers.add(c)));
      if (allCustomers.size > 0) {
        const filterBar = document.createElement('div');
        filterBar.className = 'filter-bar';
        filterBar.id = 'customer-filter';
        const saved = JSON.parse(localStorage.getItem('nexus.customerFilter') || '[]');
        let activeFilters = new Set(saved.filter(c => allCustomers.has(c)));
        const renderChips = () => {
          filterBar.innerHTML = '<span class="filter-label">Customer:</span>';
          [...allCustomers].sort().forEach(c => {
            const chip = document.createElement('span');
            chip.className = 'filter-chip' + (activeFilters.has(c) ? ' active' : '');
            chip.textContent = c;
            chip.addEventListener('click', () => {
              activeFilters.has(c) ? activeFilters.delete(c) : activeFilters.add(c);
              localStorage.setItem('nexus.customerFilter', JSON.stringify([...activeFilters]));
              renderChips();
              applyFilter();
            });
            filterBar.appendChild(chip);
          });
          if (activeFilters.size > 0) {
            const clear = document.createElement('span');
            clear.className = 'filter-chip clear';
            clear.textContent = '✕ Clear';
            clear.addEventListener('click', () => {
              activeFilters.clear();
              localStorage.removeItem('nexus.customerFilter');
              renderChips();
              applyFilter();
            });
            filterBar.appendChild(clear);
          }
        };
        const applyFilter = () => {
          const wanted = [...activeFilters].map(c => c.toLowerCase());
          document.querySelectorAll('.proj-row').forEach(row => {
            if (wanted.length === 0) { row.classList.remove('hidden'); return; }
            const rowCustomers = (row.dataset.customers || '').split('||').filter(Boolean);
            const match = rowCustomers.some(c => wanted.includes(c));
            row.classList.toggle('hidden', !match);
          });
        };
        renderChips();
        wrap.appendChild(filterBar);
        setTimeout(applyFilter, 0);
      }

      const table = document.createElement('div');
      table.className = 'proj-table';
      sorted.forEach(p => table.appendChild(renderProjectRow(p)));
      wrap.appendChild(table);

      if (notion.lastSync) {
        const sync = document.createElement('div');
        sync.style.cssText = 'margin-top:8px;font-size:11.5px;color:var(--muted)';
        sync.textContent = 'Last Notion sync: ' + notion.lastSync + (notion.source ? ' · ' + notion.source : '');
        wrap.appendChild(sync);
      }
    } else {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `No project snapshot yet.<br><br>Ask Claude on your personal laptop: <kbd>refresh Notion</kbd> — it will pull your DB and push an updated <kbd>notion-projects.json</kbd> to the repo.`;
      wrap.appendChild(empty);
    }
    appendSyncFooter(wrap, t);
    return wrap;
  }

  function renderDocuments(t) {
